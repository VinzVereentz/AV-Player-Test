name: Build AVPlayer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android --project-name avplayer --org com.vinzvereent

      - name: Copy AVPlayer main.dart
        run: | if [ -f "main.dart" ]; then cp main.dart lib/main.dart elif [ ! -f "lib/main.dart" ]; then echo "main.dart tidak ditemukan" exit 1 fi 
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVPlayer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
